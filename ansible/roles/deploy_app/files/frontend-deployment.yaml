apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfume-frontend
  labels:
    app: perfume-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perfume-frontend
  template:
    metadata:
      labels:
        app: perfume-frontend
    spec:
      containers:
        - name: perfume-frontend
          image: ghcr.io/bahaa202/perfume-ai-shop-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: perfume-frontend-service
spec:
  type: NodePort
  selector:
    app: perfume-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
